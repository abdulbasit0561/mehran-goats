<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — Mehran Goats</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            padding: 2rem;
        }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            padding: 3rem 2rem;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            display: block;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }
        p {
            font-size: 0.95rem;
            opacity: 0.9;
            line-height: 1.5;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: #fff;
            color: #059669;
            font-weight: 600;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <div class="card">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="icon" fill="none">
            <circle cx="32" cy="32" r="30" fill="#ffffff"/>
            <g transform="translate(0, -2)">
                <path d="M32 16 C24 16 20 22 20 30 C20 36 22 40 24 42 L22 46 C22 47 23 48 24 47 L26 45 C28 46 30 46.5 32 46.5 C34 46.5 36 46 38 45 L40 47 C41 48 42 47 42 46 L40 42 C42 40 44 36 44 30 C44 22 40 16 32 16 Z" fill="#059669"/>
                <ellipse cx="27" cy="30" rx="2" ry="2.5" fill="#fff"/>
                <ellipse cx="37" cy="30" rx="2" ry="2.5" fill="#fff"/>
                <path d="M23 18 C19 14 16 12 14 14 C15 17 18 19 21 20 Z" fill="#fbbf24"/>
                <path d="M41 18 C45 14 48 12 50 14 C49 17 46 19 43 20 Z" fill="#fbbf24"/>
            </g>
        </svg>
        <h1>You're Offline</h1>
        <p>You can still add new entries — they'll be saved on your device and synced automatically when you reconnect.</p>
        <a href="/dashboard" class="btn">Go to App</a>
    </div>
</body>
</html>
